<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Date · Dhiraj & Neha</title><meta name="theme-color" content="#091c31"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#091c31;color:#fff0d0;font-family:'Cormorant Garamond',serif}.landscape{position:fixed;inset:-5%;background:linear-gradient(#05162a66,#061627b3),url('banaras-boat-lit.png') center 40%/cover;z-index:-1;will-change:transform}.intro{height:64svh;min-height:360px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:35px 20px}.eyebrow{font:9px 'DM Sans',sans-serif;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(48px,12vw,85px);font-weight:400;margin:20px 0 12px}.intro p{font-size:22px;font-style:italic;margin:0}.down{margin-top:26px;font-size:25px;animation:bob 2s ease-in-out infinite}.paper-zone{min-height:110svh;padding:35px 20px 110px;background:linear-gradient(transparent,#f6e8d2 20%,#fff4e2 70%);color:#5a402b;display:flex;align-items:center;flex-direction:column}.date-card{width:min(100%,420px);padding:43px 23px 30px;background:#fff9eb url('paper-grain.svg');border:1px solid #caab70;outline:1px solid #d7bc872e;outline-offset:-9px;border-radius:145px 145px 15px 15px;box-shadow:0 22px 55px #020e2233;text-align:center;position:relative;transform:translateY(30px);opacity:0;transition:opacity 1.2s,transform 1.2s}.date-card.visible{opacity:1;transform:translateY(0)}.ornament{width:180px;max-width:70%;margin:10px auto;display:block}.date-card h2{font-size:45px;font-weight:400;margin:20px 0 12px}.date-card p{font-size:19px;line-height:1.5}.scratch-area{position:relative;height:175px;width:100%;margin:25px auto 20px;border:1px solid #d4b47e;border-radius:12px;overflow:hidden;background:#f4e7cf}.revealed-date{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px}.revealed-date strong{font-size:36px;font-weight:500;color:#6f4926}.revealed-date span{font:10px 'DM Sans',sans-serif;letter-spacing:3px;margin-top:15px}.scratch-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .9s}.scratch-area.done canvas{opacity:0;pointer-events:none}.reveal-button{border:0;border-bottom:1px solid #ba965b;padding:6px 0;background:none;font:10px 'DM Sans',sans-serif;letter-spacing:1px;color:#8c6b43;cursor:pointer}.hint{font-size:16px!important;color:#9b7b53;margin-bottom:0}.back{position:absolute;left:20px;top:20px;color:#fff0d0;text-decoration:none;font:10px 'DM Sans',sans-serif;letter-spacing:1px}.closing{margin-top:45px;text-align:center;font-size:23px}.status{font:12px 'DM Sans',sans-serif;min-height:20px;color:#8e673a}.page-enter{animation:enter 1s ease both}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.date-card{opacity:1;transform:none}.landscape{will-change:auto}}</style></head><body><div class="landscape" aria-hidden="true"></div><a class="back" href="index.html">← Back to the opening</a><main class="page-enter"><header class="intro"><div class="eyebrow">Dhiraj & Neha</div><h1>A date to remember</h1><p>The beginning of our forever.</p><a class="down" href="#date" aria-label="Scroll to reveal the wedding date" style="color:inherit;text-decoration:none">↓</a></header><section class="paper-zone" id="date"><article class="date-card"><img class="ornament" src="krishna-wedding-ornament.svg" alt=""><div class="eyebrow">Save the date</div><h2>The Wedding</h2><p>A little surprise,<br>a beautiful beginning.</p><div class="scratch-area"><div class="revealed-date" aria-hidden="true"><strong>2nd December<br>2026</strong><span>WEDNESDAY</span></div><canvas aria-label="Scratch here to reveal the wedding date"></canvas></div><div class="status" aria-live="polite"></div><button class="reveal-button" type="button">Tap to reveal the date</button><p class="hint">Scratch the gold to uncover our special day.</p></article><p class="closing">With love, Dhiraj & Neha</p></section></main><script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,card=document.querySelector('.date-card'),area=document.querySelector('.scratch-area'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let revealed=false,down=false,last=null,draws=0;const ratio=Math.min(devicePixelRatio||1,2);
function paint(){if(revealed)return;const r=area.getBoundingClientRect();canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.globalCompositeOperation='source-over';const grad=ctx.createLinearGradient(0,0,r.width,r.height);grad.addColorStop(0,'#d6b875');grad.addColorStop(.3,'#f2dc9f');grad.addColorStop(.6,'#c5a15b');grad.addColorStop(1,'#e7ce91');ctx.fillStyle=grad;ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<1700;i++){ctx.fillStyle=i%2?'rgba(255,255,230,.16)':'rgba(104,71,24,.09)';ctx.fillRect(Math.random()*r.width,Math.random()*r.height,1,1)}ctx.fillStyle='#775a2d';ctx.textAlign='center';ctx.font='italic 25px Georgia';ctx.fillText('Scratch to reveal',r.width/2,r.height/2+7);ctx.font='10px sans-serif';ctx.fillText('OUR WEDDING DATE',r.width/2,r.height/2+30)}
function reveal(){if(revealed)return;revealed=true;area.classList.add('done');document.querySelector('.revealed-date').removeAttribute('aria-hidden');document.querySelector('.status').textContent='2nd December 2026 · Wednesday';document.querySelector('.reveal-button').hidden=true;document.querySelector('.hint').textContent='We can’t wait to celebrate with you.'}
function scratch(e){if(revealed)return;const r=canvas.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=42;ctx.beginPath();ctx.moveTo(last?last.x:p.x,last?last.y:p.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(++draws%10===0){const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<pixels.length;i+=64){total++;if(pixels[i]<100)clear++}if(clear/total>.38)reveal()}}
canvas.addEventListener('pointerdown',e=>{down=true;last=null;canvas.setPointerCapture(e.pointerId);scratch(e)});canvas.addEventListener('pointermove',e=>{if(down)scratch(e)});['pointerup','pointercancel','lostpointercapture'].forEach(type=>canvas.addEventListener(type,()=>{down=false;last=null}));document.querySelector('.reveal-button').onclick=reveal;new ResizeObserver(paint).observe(area);paint();new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)card.classList.add('visible')}),{threshold:.15}).observe(card);
if(!reduce){let queued=false;addEventListener('scroll',()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{document.querySelector('.landscape').style.transform=`translateY(${-Math.min(scrollY*.12,90)}px) scale(1.04)`;queued=false})},{passive:true})}
</script></body></html>
